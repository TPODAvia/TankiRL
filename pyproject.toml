[project]
name = "tankirl"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<3", "gymnasium>=1.1,<1.3", "stable-baselines3>=2.6,<3", "sb3-contrib>=2.6,<3", "torch>=2.7,<2.10", "tensorboard>=2.19", "opencv-python-headless>=4.10", "playwright>=1.52", "PyYAML>=6", "pillow>=11", "pytest>=8", "huggingface-hub>=0.30,<1"]
[project.optional-dependencies]
p2p = ["torchvision==0.24.1", "lightning>=2.5", "pydantic-yaml>=1.4", "wandb>=0.19", "einops==0.8.0", "kornia==0.7.3", "transformers==4.56.0", "sentence-transformers>=2.6", "accelerate", "omegaconf>=2.3", "funcy>=2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["tankirl*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: launches a real local WebGL game", "p2p: requires official checkpoint"]
